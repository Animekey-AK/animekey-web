name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Stub env vars so t3-env doesn't throw at build time in CI
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://example.com
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://example.com
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          PAYFORT_MERCHANT_IDENTIFIER: ${{ secrets.PAYFORT_MERCHANT_IDENTIFIER }}
          PAYFORT_ACCESS_CODE: ${{ secrets.PAYFORT_ACCESS_CODE }}
          PAYFORT_SHA_REQUEST_PHRASE: ${{ secrets.PAYFORT_SHA_REQUEST_PHRASE }}
          PAYFORT_SHA_RESPONSE_PHRASE: ${{ secrets.PAYFORT_SHA_RESPONSE_PHRASE }}
          PAYFORT_BASE_URL: https://sbpaymentservices.payfort.com/FortAPI/paymentApi
          API_BASE_URL: https://example.com
          API_KEY: ci-placeholder
